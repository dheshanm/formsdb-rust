[workspace]
resolver = "2"
members = [
    "crates/db",
    "crates/ampscz",
    "crates/mindlamp_gps",
]

[workspace.package]
version = "0.2.0"
edition = "2024"

[workspace.dependencies]
db = { path = "crates/db" }

# tokio (no TLS)
sqlx = { version = "0.9", features = [ "runtime-tokio", "postgres", "json", "chrono" ] }
tokio = { version = "1", features = ["full"] }

# Excel file reading
calamine = "0.36"

# Dataframes
polars = { version = "0.55", features = ["json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# progress bars
indicatif = { version = "0.18", features = ["improved_unicode"] }
tracing-indicatif = "0.3"

# CLI Application
clap = { version = "4.6", features = ["derive"] }

# Maps
hashify = "0.2.9"

futures-util = "0.3"
